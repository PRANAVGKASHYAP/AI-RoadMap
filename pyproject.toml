[project]
name = "ai-engineeringroadmap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranav g kashyap", email = "pkgnov03@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "tenacity>=9.2.1",
]

[project.scripts]
ai-engineeringroadmap = "ai_engineeringroadmap:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Defaults already cover Pyflakes (F) and core pycodestyle (E) rules.
# extend-select adds more on top of them.
extend-select = ["I", "UP", "B"]  # import sorting, pyupgrade, bugbear
